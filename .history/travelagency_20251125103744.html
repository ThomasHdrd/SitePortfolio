<script>
const translations = {
    fr: {
        menu_about: "Accueil",
        menu_portfolio: "Portfolio",
        menu_exp_pro: "Expériences Pro",
        menu_projects_design: "Projets Design",
        menu_projects_dev: "Projets Dev",
        menu_projects_personal: "Perso",
        menu_contact: "Contact",
        menu_cv: "Travailler avec moi",
        footer: "©2025 Thomas Houdard · Tous droits réservés",
        travel_banner: "Intégration · UI · Responsive",
        travel_pres_tagline: "Page d'accueil statique mettant en avant des destinations et une navigation simple.",
        travel_meta_type: "PROJET : Site vitrine",
        travel_meta_role: "RÔLE : Intégration HTML & CSS",
        travel_meta_stack: "STACK : HTML · CSS",
        travel_meta_date: "DATE : 2024",
        travel_meta_duree: "DURÉE : 1 semaine",
        travel_overview_title: "Présentation",
        travel_pres1: "Travel Agency est une page d'accueil statique conçue pour une agence de voyages ou un blog personnel.",
        travel_pres2: "Objectif : présenter clairement des destinations à venir avec une structure légère et rapide à charger.",
        travel_pres3: "Le design minimaliste facilite la lisibilité et la réutilisation du modèle pour d'autres contenus.",
        travel_focus_title: "Focus",
        travel_focus1: "Hiérarchie visuelle propre",
        travel_focus2: "Compatibilité multi-écrans",
        travel_focus3: "Structure réutilisable",
        travel_features_title: "Fonctionnalités",
        travel_feature1: "Accueil épuré",
        travel_feature2: "Design responsive",
        travel_feature3: "Sections simples",
        travel_feature4: "Navigation intuitive",
        titre_dev_technos: "Technologies utilisées",
        travel_tech_html: "Structure sémantique",
        travel_tech_css: "Mise en page & responsive",
        travel_links_title: "Liens",
        travel_button_site: "Voir le site en ligne",
        travel_button_code: "Voir le code sur GitHub",
        cta_scroll_overview: "Voir la présentation",
        cta_scroll_tools: "Voir les technologies",
        travel_cta_features: "Fonctionnalités",
        travel_cta_links: "Liens"
    },
    en: {
        menu_about: "Home",
        menu_portfolio: "Portfolio",
        menu_exp_pro: "Work Experience",
        menu_projects_design: "Design Projects",
        menu_projects_dev: "Dev Projects",
        menu_projects_personal: "Personal",
        menu_contact: "Contact",
        menu_cv: "Work with me",
        footer: "©2025 Thomas Houdard · All rights reserved",
        travel_banner: "Integration · UI · Responsive",
        travel_pres_tagline: "Static landing page highlighting destinations with clean navigation.",
        travel_meta_type: "PROJECT: Showcase site",
        travel_meta_role: "ROLE: HTML & CSS Integration",
        travel_meta_stack: "STACK: HTML · CSS",
        travel_meta_date: "DATE: 2024",
        travel_meta_duree: "DURATION: 1 week",
        travel_overview_title: "Overview",
        travel_pres1: "Travel Agency is a static landing page for a travel agency or personal blog.",
        travel_pres2: "Goal: clearly highlight upcoming destinations with a lightweight structure.",
        travel_pres3: "Minimal design improves readability and makes the template reusable.",
        travel_focus_title: "Focus",
        travel_focus1: "Clean visual hierarchy",
        travel_focus2: "Multi-device compatibility",
        travel_focus3: "Reusable structure",
        travel_features_title: "Features",
        travel_feature1: "Clean homepage",
        travel_feature2: "Responsive design",
        travel_feature3: "Simple sections",
        travel_feature4: "Intuitive navigation",
        titre_dev_technos: "Technologies used",
        travel_tech_html: "Semantic structure",
        travel_tech_css: "Layout & responsiveness",
        travel_links_title: "Links",
        travel_button_site: "View live site",
        travel_button_code: "View code on GitHub",
        cta_scroll_overview: "View overview",
        cta_scroll_tools: "View technologies",
        travel_cta_features: "Features",
        travel_cta_links: "Links"
    }
};

const applyLang = (lang) => {
    document.querySelectorAll("[data-key]").forEach(el => {
        const k = el.getAttribute("data-key");
        if (translations[lang][k]) el.textContent = translations[lang][k];
    });
    document.querySelectorAll(".lang-switch button").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
    });
    document.documentElement.lang = lang;
    localStorage.setItem("lang", lang);
};
const initLang = () => {
    const stored = localStorage.getItem("lang") || "fr";
    applyLang(stored);
};
document.getElementById("langSwitch").addEventListener("click", e => {
    if (e.target.matches("button[data-lang]")) applyLang(e.target.dataset.lang);
});
const burger = document.getElementById("burger");
const menu = document.getElementById("menu");
burger.addEventListener("click", () => {
    burger.classList.toggle("open");
    menu.classList.toggle("open");
});
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
        }
    });
},{ threshold:0.12 });
document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
initLang();
</script>
</body>
