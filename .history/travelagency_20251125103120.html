<script>
const translations = {
    fr: {
        menu_about: "Accueil",
        menu_portfolio: "Portfolio",
        menu_exp_pro: "Expériences Pro",
        menu_projects_design: "Projets Design",
        menu_projects_dev: "Projets Dev",
        menu_projects_personal: "Perso",
        menu_contact: "Contact",
        menu_cv: "Travailler avec moi",
        footer: "©2025 Thomas Houdard · Tous droits réservés",
        cta_scroll_overview: "Voir la présentation",
        cta_scroll_tools: "Voir les outils",
        travel_cta_features: "Fonctionnalités",
        travel_cta_code: "Voir le code",
        travel_banner: "Page d'accueil statique · HTML · CSS · Responsive",
        travel_tagline: "Site vitrine minimaliste pour présenter des destinations de voyage futures.",
        travel_meta_type: "TYPE : Landing Page",
        travel_meta_role: "RÔLE : Intégration & Design UI",
        travel_meta_stack: "STACK : HTML + CSS",
        travel_overview_title: "Présentation",
        travel_pres1: "Travel Agency est un projet de page d'accueil statique développé avec HTML et CSS, conçu pour une agence de voyages ou un blog personnel. Interface épurée mettant en avant les destinations à venir avec une navigation intuitive.",
        dev_fonctionnalites: "Fonctionnalités principales",
        travel_pres_liste1: "PAGE D'ACCUEIL : Interface claire et minimaliste pour accueillir les visiteurs.",
        travel_pres_liste2: "DESIGN RESPONSIVE : Adapté aux différents types d'appareils (mobiles, tablettes, ordinateurs).",
        travel_focus_title: "Objectif",
        travel_focus_text: "Créer une base simple réutilisable pour présenter des offres ou inspirations voyage.",
        travel_meta_focus: "FOCUS : Clarté & lisibilité",
        travel_meta_responsive: "RESPONSIVE : Mobile-first",
        travel_meta_objectif: "OBJECTIF : Présentation rapide",
        travel_site_title: "Site en ligne",
        dev_button1: "Voir le site en ligne",
        titre_dev_technos: "Technologies utilisées",
        travel_tool_html: "Structure sémantique propre pour SEO et accessibilité basique.",
        travel_tool_css: "Mise en page responsive, typographie et grille flexible.",
        travel_code_title: "Code source",
        dev_button2: "Voir le code sur GitHub"
    },
    en: {
        menu_about: "Home",
        menu_portfolio: "Portfolio",
        menu_exp_pro: "Experience",
        menu_projects_design: "Design Projects",
        menu_projects_dev: "Dev Projects",
        menu_projects_personal: "Personal",
        menu_contact: "Contact",
        menu_cv: "Work with me",
        footer: "©2025 Thomas Houdard · All rights reserved",
        cta_scroll_overview: "View overview",
        cta_scroll_tools: "View tools",
        travel_cta_features: "Features",
        travel_cta_code: "View code",
        travel_banner: "Static landing · HTML · CSS · Responsive",
        travel_tagline: "Minimal showcase site to present upcoming travel destinations.",
        travel_meta_type: "TYPE: Landing Page",
        travel_meta_role: "ROLE: Integration & UI Design",
        travel_meta_stack: "STACK: HTML + CSS",
        travel_overview_title: "Overview",
        travel_pres1: "Travel Agency is a static landing page project built with HTML and CSS for a travel agency or personal blog. Clean interface highlighting future destinations with intuitive navigation.",
        dev_fonctionnalites: "Main Features",
        travel_pres_liste1: "HOME PAGE: Clear minimalist interface welcoming visitors.",
        travel_pres_liste2: "RESPONSIVE DESIGN: Adapts to mobile, tablet and desktop.",
        travel_focus_title: "Goal",
        travel_focus_text: "Provide a simple reusable base to showcase offers or travel inspiration.",
        travel_meta_focus: "FOCUS: Clarity & readability",
        travel_meta_responsive: "RESPONSIVE: Mobile-first",
        travel_meta_objectif: "GOAL: Quick presentation",
        travel_site_title: "Live site",
        dev_button1: "View live site",
        titre_dev_technos: "Technologies used",
        travel_tool_html: "Semantic structure for basic SEO and accessibility.",
        travel_tool_css: "Responsive layout, typography and flexible grid.",
        travel_code_title: "Source code",
        dev_button2: "View code on GitHub"
    }
};

const applyLang = (lang) => {
    document.querySelectorAll("[data-key]").forEach(el => {
        const k = el.getAttribute("data-key");
        if (translations[lang][k]) el.textContent = translations[lang][k];
    });
    document.querySelectorAll(".lang-switch button").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
    });
    document.documentElement.lang = lang;
    localStorage.setItem("lang", lang);
};

const initLang = () => {
    const stored = localStorage.getItem("lang") || "fr";
    applyLang(stored);
};

document.getElementById("langSwitch").addEventListener("click", e => {
    if (e.target.matches("button[data-lang]")) applyLang(e.target.dataset.lang);
});

const burger = document.getElementById("burger");
const menu = document.getElementById("menu");
burger.addEventListener("click", () => {
    burger.classList.toggle("open");
    menu.classList.toggle("open");
});

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
        }
    });
},{ threshold:0.12 });
document.querySelectorAll(".reveal").forEach(el => observer.observe(el));

initLang();
</script>
