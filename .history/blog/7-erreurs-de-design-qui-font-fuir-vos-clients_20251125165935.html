<script>
const translations = {/* garder votre objet existant */ <?php /* placeholder if server side; sinon supprimez */ ?>};
function applyLang(lang){
  document.querySelectorAll("[data-key]").forEach(el=>{
    const k=el.getAttribute("data-key");
    if(translations[lang] && translations[lang][k]) el.textContent=translations[lang][k];
  });
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===lang);
  });
  document.documentElement.lang=lang;
  localStorage.setItem("lang",lang);
}
(function init(){
  const stored = localStorage.getItem("lang") || "fr";
  applyLang(stored);
})();
document.getElementById("langSwitch").addEventListener("click",e=>{
  if(e.target.matches("button[data-lang]")) applyLang(e.target.dataset.lang);
});
const burger=document.getElementById("burger");
const menu=document.getElementById("menu");
burger.addEventListener("click",()=>{burger.classList.toggle("open");menu.classList.toggle("open");});
const observer=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){en.target.classList.add("visible");observer.unobserve(en.target);}
  });
},{threshold:.14});
document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));
</script>
